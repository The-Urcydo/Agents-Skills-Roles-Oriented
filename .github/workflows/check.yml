name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch. A newer push cancels the older run.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.python-version }})
    # Pin the image: an ubuntu-latest migration must not change CI mid-review.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved). Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 tools/check.py --strict
      - run: python3 -m unittest discover -s tools/tests -v
